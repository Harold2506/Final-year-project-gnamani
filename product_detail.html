<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail — RecommendX</title>
    <meta name="description" content="View product specifications and find similar products.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-cpu"></i> RecommendX</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="compare.html">Compare</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- BREADCRUMB -->
    <div class="bg-white border-bottom">
        <div class="container py-2">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0" style="font-size:.85rem;">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none"
                            style="color:var(--accent);">Home</a></li>
                    <li class="breadcrumb-item active" id="breadcrumbName">Product</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- MAIN -->
    <main class="container py-4">
        <!-- Product Detail Card -->
        <div class="detail-hero mb-5" id="detailCard">
            <!-- Filled by JS -->
        </div>

        <!-- Similar Products Section -->
        <section>
            <h2 class="section-title"><i class="bi bi-diagram-3-fill"></i> Similar Products</h2>
            <p class="text-muted mb-3" style="font-size:.85rem;">
                Products recommended by the Content-Based engine (same category & similar specs).
            </p>
            <div class="row g-3" id="similarRow">
                <!-- Filled by JS -->
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-0">© 2026 Online Product Recommendation System — Final Year Project</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const products = [
            { id: 101, name: "iPhone Pro 1", category: "Smartphone", price: 1044.93, ram: "8GB", storage: "256GB", battery: "4000mAh", rating: 4.6 },
            { id: 102, name: "iPhone Edition 2", category: "Smartphone", price: 1044.40, ram: "6GB", storage: "1TB", battery: "4000mAh", rating: 3.5 },
            { id: 103, name: "iPhone Ultra 3", category: "Smartphone", price: 739.60, ram: "6GB", storage: "256GB", battery: "5000mAh", rating: 4.5 },
            { id: 104, name: "iPhone Max 4", category: "Smartphone", price: 851.71, ram: "16GB", storage: "512GB", battery: "4000mAh", rating: 4.6 },
            { id: 105, name: "iPhone Ultra 5", category: "Smartphone", price: 1018.88, ram: "12GB", storage: "512GB", battery: "4000mAh", rating: 3.8 },
            { id: 106, name: "Samsung Galaxy Pro 1", category: "Smartphone", price: 655.65, ram: "6GB", storage: "512GB", battery: "4500mAh", rating: 4.4 },
            { id: 109, name: "Samsung Galaxy Edition 4", category: "Smartphone", price: 736.74, ram: "12GB", storage: "128GB", battery: "4000mAh", rating: 4.8 },
            { id: 111, name: "Samsung Galaxy Edition 6", category: "Smartphone", price: 760.19, ram: "6GB", storage: "256GB", battery: "5000mAh", rating: 4.6 },
            { id: 113, name: "Google Pixel Ultra 1", category: "Smartphone", price: 1093.08, ram: "12GB", storage: "1TB", battery: "4500mAh", rating: 3.6 },
            { id: 115, name: "Google Pixel Edition 3", category: "Smartphone", price: 875.31, ram: "12GB", storage: "256GB", battery: "4000mAh", rating: 4.6 },
            { id: 118, name: "OnePlus Edition 1", category: "Smartphone", price: 853.30, ram: "6GB", storage: "1TB", battery: "4500mAh", rating: 4.4 },
            { id: 121, name: "OnePlus Air 4", category: "Smartphone", price: 601.95, ram: "12GB", storage: "256GB", battery: "5000mAh", rating: 4.9 },
            { id: 122, name: "OnePlus Edition 5", category: "Smartphone", price: 779.07, ram: "8GB", storage: "256GB", battery: "4500mAh", rating: 4.6 },
            { id: 124, name: "Xiaomi Plus 1", category: "Smartphone", price: 743.67, ram: "8GB", storage: "128GB", battery: "4000mAh", rating: 4.6 },
            { id: 126, name: "Xiaomi Max 3", category: "Smartphone", price: 699.08, ram: "16GB", storage: "256GB", battery: "5000mAh", rating: 4.6 },
            { id: 131, name: "MacBook Air Plus 1", category: "Laptop", price: 1937.26, ram: "16GB", storage: "512GB", battery: "100Wh", rating: 3.9 },
            { id: 135, name: "MacBook Air Air 5", category: "Laptop", price: 1038.31, ram: "16GB", storage: "1TB", battery: "100Wh", rating: 3.9 },
            { id: 136, name: "MacBook Air Pro 6", category: "Laptop", price: 1553.32, ram: "8GB", storage: "256GB", battery: "50Wh", rating: 5.0 },
            { id: 137, name: "MacBook Pro Ultra 1", category: "Laptop", price: 1490.90, ram: "64GB", storage: "512GB", battery: "100Wh", rating: 4.9 },
            { id: 142, name: "MacBook Pro Pro 6", category: "Laptop", price: 1811.56, ram: "16GB", storage: "2TB", battery: "50Wh", rating: 4.9 },
            { id: 143, name: "Dell XPS Max 1", category: "Laptop", price: 1810.68, ram: "8GB", storage: "2TB", battery: "85Wh", rating: 4.9 },
            { id: 148, name: "Dell XPS Air 6", category: "Laptop", price: 2217.37, ram: "32GB", storage: "256GB", battery: "85Wh", rating: 4.9 },
            { id: 152, name: "HP Spectre Ultra 4", category: "Laptop", price: 1883.09, ram: "32GB", storage: "512GB", battery: "100Wh", rating: 4.3 },
            { id: 156, name: "Lenovo ThinkPad Max 3", category: "Laptop", price: 2303.03, ram: "64GB", storage: "512GB", battery: "70Wh", rating: 4.8 },
            { id: 161, name: "ASUS Zenbook Plus 1", category: "Laptop", price: 1273.63, ram: "8GB", storage: "1TB", battery: "85Wh", rating: 4.5 },
            { id: 162, name: "ASUS Zenbook Air 2", category: "Laptop", price: 1955.18, ram: "32GB", storage: "256GB", battery: "50Wh", rating: 4.8 },
        ];

        function stars(r) { let f = Math.floor(r), h = r % 1 >= .3 ? 1 : 0, s = ''; for (let i = 0; i < f; i++)s += '<i class="bi bi-star-fill"></i>'; if (h) s += '<i class="bi bi-star-half"></i>'; for (let i = 0; i < 5 - f - h; i++)s += '<i class="bi bi-star"></i>'; return s; }

        // Get product ID from URL
        const params = new URLSearchParams(window.location.search);
        const pid = parseInt(params.get('id')) || 101;
        const product = products.find(p => p.id === pid) || products[0];

        // Render detail card
        document.getElementById('breadcrumbName').textContent = product.name;
        document.title = `${product.name} — RecommendX`;

        const catClass = product.category.toLowerCase();
        document.getElementById('detailCard').innerHTML = `
    <div class="row align-items-center">
        <div class="col-lg-5 text-center mb-3 mb-lg-0">
            <div style="background:var(--bg-light);border-radius:var(--radius);padding:3rem 2rem;">
                <i class="bi ${product.category === 'Smartphone' ? 'bi-phone' : 'bi-laptop'}" style="font-size:5rem;color:var(--primary);"></i>
                <div class="mt-2"><span class="detail-category ${catClass}">${product.category}</span></div>
            </div>
        </div>
        <div class="col-lg-7">
            <h1 style="font-weight:700;font-size:1.75rem;color:var(--primary);">${product.name}</h1>
            <div class="mb-2">
                <span class="stars" style="color:var(--star);font-size:1.1rem;">${stars(product.rating)}</span>
                <span style="font-size:.9rem;color:var(--text-muted);margin-left:.35rem;">${product.rating} / 5.0</span>
            </div>
            <div style="font-size:1.75rem;font-weight:700;color:var(--primary);margin-bottom:.5rem;">$${product.price.toLocaleString()}</div>
            <p style="color:var(--text-muted);font-size:.9rem;">
                A high-quality ${product.category.toLowerCase()} with ${product.ram} RAM and ${product.storage} storage. 
                Powered by a ${product.battery} battery for all-day performance.
            </p>
            <div class="spec-grid">
                <div class="spec-item"><div class="spec-label">RAM</div><div class="spec-value">${product.ram}</div></div>
                <div class="spec-item"><div class="spec-label">Storage</div><div class="spec-value">${product.storage}</div></div>
                <div class="spec-item"><div class="spec-label">Battery</div><div class="spec-value">${product.battery}</div></div>
                <div class="spec-item"><div class="spec-label">Category</div><div class="spec-value">${product.category}</div></div>
            </div>
            <div class="mt-3">
                <a href="compare.html?ids=${product.id}" class="btn btn-primary-custom"><i class="bi bi-arrow-left-right"></i> Add to Compare</a>
            </div>
        </div>
    </div>
`;

        // Render similar products (same category, excluding current)
        const similar = products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
        const simRow = document.getElementById('similarRow');
        similar.forEach(p => {
            const cc = p.category.toLowerCase();
            simRow.innerHTML += `
    <div class="col-md-4 col-lg-3">
        <div class="product-card">
            <span class="card-category ${cc}">${p.category}</span>
            <div class="card-title">${p.name}</div>
            <div class="card-rating">
                <span class="stars">${stars(p.rating)}</span>
                <span class="rating-num">${p.rating}</span>
            </div>
            <div class="card-price mt-1">$${p.price.toLocaleString()}</div>
            <div class="card-specs">
                <span><i class="bi bi-memory"></i> ${p.ram}</span>
                <span><i class="bi bi-device-ssd"></i> ${p.storage}</span>
            </div>
            <div class="card-actions">
                <a href="product_detail.html?id=${p.id}" class="btn btn-sm btn-primary-custom">View Details</a>
            </div>
        </div>
    </div>`;
        });
    </script>
</body>

</html>
